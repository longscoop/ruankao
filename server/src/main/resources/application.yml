spring:
  servlet:
    multipart:
      max-file-size: 80MB
      max-request-size: 80MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ruankao}
    username: ${DB_USERNAME:ruankao}
    password: ${DB_PASSWORD:ruankao}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  type-handlers-package: com.longscoop.ruankao.common.persistence
  configuration:
    map-underscore-to-camel-case: true

ruankao:
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
