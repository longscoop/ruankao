server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://www.e68q.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.e68q.cn;

    ssl_certificate /etc/letsencrypt/live/www.e68q.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.e68q.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/ruankao-admin;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/ {
        alias /opt/ruankao/data/storage/;
        autoindex off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
