name: Miniapp CI

on:
  push:
    paths:
      - 'miniapp/**'
      - '.github/workflows/miniapp-ci.yml'
  pull_request:
    paths:
      - 'miniapp/**'
      - '.github/workflows/miniapp-ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:mp-weixin
